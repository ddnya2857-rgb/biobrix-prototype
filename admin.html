<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - BIOBRIX</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="container navbar">
            <div class="logo">
                <img src="images/logo.png" alt="BIOBRIX Logo">
                <span class="logo-text">BIOBRIX <span style="font-size: 0.9rem; color: var(--vert-secondaire);">[Admin]</span></span>
            </div>
            <nav class="nav-links">
                <a href="index.html">Retour au site</a>
            </nav>
        </div>
    </header>

    <main class="section">
        <div class="container">
            <h1 class="section-title">Tableau de bord administrateur</h1>
            <p class="section-subtitle">Gestion des commandes clients et suivi des ventes du prototype.</p>

            <div style="margin-top: 40px;">
                <h2 style="color: var(--vert-fonce); margin-bottom: 20px; font-size: 1.4rem;">Commandes reçues</h2>
                <div id="admin-orders-container">
                    <!-- سيتم تعبئة الطلبات ديناميكياً -->
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container" style="text-align: center; color: #AAAAAA; font-size: 0.85rem;">
            <p>&copy; 2026 BIOBRIX – Panneau d'administration sécurisé.</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
    <script>
        function renderAdminOrders() {
            const orders = getOrders();
            const container = document.getElementById('admin-orders-container');

            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="card" style="text-align: center; padding: 40px;">
                        <p style="color: var(--gris-texte);">Aucune commande enregistrée pour le moment.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = orders.map((order, index) => `
                <div class="card" style="margin-bottom: 20px; display: flex; flex-direction: column; gap: 15px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--bordure); padding-bottom: 10px;">
                        <div>
                            <h4 style="color: var(--vert-fonce);">Commande : ${order.id}</h4>
                            <p style="font-size: 0.85rem; color: var(--gris-texte);">Date : ${order.date}</p>
                        </div>
                        <div>
                            <span style="background-color: var(--vert-clair); color: var(--vert-fonce); padding: 5px 12px; border-radius: 15px; font-weight: 600; font-size: 0.85rem;">${order.status}</span>
                            <button onclick="deleteOrder(${index})" style="background: none; border: none; color: #d9534f; cursor: pointer; margin-left: 15px;"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                    <div>
                        <p style="font-size: 0.9rem; margin-bottom: 5px;"><strong>Client :</strong> ${order.customer.fullname} (${order.customer.phone})</p>
                        <p style="font-size: 0.9rem; margin-bottom: 10px;"><strong>Adresse :</strong> ${order.customer.address}, ${order.customer.wilaya}</p>
                    </div>
                    <div style="background-color: var(--beige-naturel); padding: 10px; border-radius: 6px;">
                        <p style="font-size: 0.85rem; font-weight: 600; margin-bottom: 5px;">Articles commandés :</p>
                        ${order.items.map(item => `<p style="font-size: 0.85rem; color: var(--gris-texte);">• ${item.name} (x${item.quantity}) - ${item.price * item.quantity} DA</p>`).join('')}
                    </div>
                    <div style="text-align: right; font-weight: 700; color: var(--vert-fonce); font-size: 1.1rem;">
                        Total : ${order.total} DA
                    </div>
                </div>
            `).join('');
        }

        function deleteOrder(index) {
            let orders = getOrders();
            orders.splice(index, 1);
            localStorage.setItem('biobrix_orders', JSON.stringify(orders));
            renderAdminOrders();
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderAdminOrders();
        });
    </script>
</body>
</html>
